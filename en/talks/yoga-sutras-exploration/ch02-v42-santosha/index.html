<script>
(function(){
  marked.setOptions({gfm:true, breaks:false, mangle:false, headerIds:false});
  var cache = {}, RES = null, curLang = null;
  var LANGS = ["en", "es"], DEFAULT_LANG = "en", META = {"en": {"title": "Sutra 2:42 — Santosha | Yoga Sutras — Exploration and Application | 15 September 2026", "description": "From contentment, unsurpassed happiness is gained. Class by Satchidananda, Janardhana, Instituto Yoga Carrasco, Montevideo, 15 September 2026.", "og_title": "Sutra 2:42 — Santosha | Yoga Sutras — Exploration and Application", "og_description": "From contentment, unsurpassed happiness is gained.", "locale": "en_US", "locale_alt": "es_LA", "c_series": "Yoga Sutras — Exploration and Application", "c_h1": "Sutra 2:42 — Santosha", "c_meta_html": "Class by Satchidananda &middot; hosted by Janardhana, Instituto Yoga Carrasco, Montevideo<br> 15 September 2026 &middot; <a href=\"https://youtu.be/gitja69jjuY\" target=\"_blank\" rel=\"noopener noreferrer\">recording</a> &middot; <a href=\"https://yogaedu-org.github.io/sutra-reader/?tab=sutra&deck=sutra-renderings&card=1\" target=\"_blank\" rel=\"noopener noreferrer\">Sutra Reader</a>"}, "es": {"title": "Sutra 2:42 — Santosha | Yoga Sutras — Exploración y Aplicación | 15 de septiembre de 2026", "description": "De la práctica del contentamiento proviene una felicidad insuperable. Clase de Satchidananda, Janardhana, Instituto Yoga Carrasco, Montevideo, 15 de septiembre de 2026.", "og_title": "Sutra 2:42 — Santosha | Yoga Sutras — Exploración y Aplicación", "og_description": "De la práctica del contentamiento proviene una felicidad insuperable.", "locale": "es_LA", "locale_alt": "en_US", "c_series": "Yoga Sutras — Exploración y Aplicación", "c_h1": "Sutra 2:42 — Santosha", "c_meta_html": "Clase de Satchidananda &middot; organizada por Janardhana, Instituto Yoga Carrasco, Montevideo<br> 15 de septiembre de 2026 &middot; <a href=\"https://youtu.be/gitja69jjuY\" target=\"_blank\" rel=\"noopener noreferrer\">grabación</a> &middot; <a href=\"https://yogaedu-org.github.io/sutra-reader/?tab=sutra&deck=sutra-renderings&card=1&lang=es\" target=\"_blank\" rel=\"noopener noreferrer\">Sutra Reader</a>"}};

  function applyMeta(lang){      // the head must describe what the reader is seeing
    var m = META[lang] || META[DEFAULT_LANG];
    if (!m) return;
    document.title = m.title;
    [["name","description",m.description], ["property","og:title",m.og_title],
     ["property","og:description",m.og_description], ["property","og:locale",m.locale],
     ["property","og:locale:alternate",m.locale_alt]].forEach(function(r){
      var el = document.head.querySelector("meta[" + r[0] + '="' + r[1] + '"]');
      if (el) el.setAttribute("content", r[2]);
    });
    var t1 = document.getElementById("m-series"); if (t1) t1.textContent = m.c_series;
    var t2 = document.getElementById("m-h1");     if (t2) t2.textContent = m.c_h1;
    var t3 = document.getElementById("m-meta");   if (t3) t3.innerHTML  = m.c_meta_html;
  }

  function pickLang(supported, fallback){
    var q = new URLSearchParams(location.search);
    new URLSearchParams((location.hash || "").replace(/^#[?]?/, "")).forEach(function(v, k){ q.set(k, v); });
    var want = (q.get("lang") || "").toLowerCase();
    if (want && supported.indexOf(want) > -1) return want;     // 1. the link wins
    try {
      var saved = localStorage.getItem("sutras-lang-v2");
      if (saved && supported.indexOf(saved) > -1) return saved; // 2. the reader's own choice
    } catch(e){}
    var prefs = (navigator.languages && navigator.languages.length)
                  ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < prefs.length; i++){                  // 3. what the browser asks for
      var base = String(prefs[i]).toLowerCase().split("-")[0];
      if (supported.indexOf(base) > -1) return base;
    }
    return supported.indexOf(fallback) > -1 ? fallback : supported[0];  // 4. the class default
  }


  function renderResources(list, base, lang){
    var el = document.getElementById("resources");
    if (!el || !list || !list.length) return;
    var S = {en:{h:"Resources", listen:"Listen on", dl:"Download", open:"Open"},
             es:{h:"Recursos", listen:"Escuchar en", dl:"Descargar", open:"Abrir"}}[lang === "es" ? "es" : "en"];
    var html = '<p class="res-heading">' + S.h + '</p>';
    list.forEach(function(r){
      var desc = (lang === "es" && r.description_es) ? r.description_es : (r.description || "");
      var title = (lang === "es" && r.title_es) ? r.title_es : r.title;
      var out = function(href, inner){     // every card title opens the card's own thing
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>';
      };
      if (r.type === "link"){
        var multi = !!(r.links && r.links.length);
        var links = multi ? r.links : [{label: S.open + ' &middot; ' + (r.source || ""), url: r.url}];
        var go = links.map(function(L){
          var lbl = (lang === "es" && L.label_es) ? L.label_es : (L.label || S.open);
          var a = '<a class="res-go" href="' + L.url + '" target="_blank" rel="noopener noreferrer">' +
            lbl + ' &rarr;</a>';
          return multi ? '<li>' + a + '</li>' : a;
        }).join("");
        html += '<div class="res-card"><div class="res-body">' +
          '<p class="res-title">' + out(links[0].url, title) + '</p>' +
          (desc ? '<p class="res-meta">' + desc + '</p>' : '') +
          (multi ? '<ul class="res-links">' + go + '</ul>' : go) + '</div></div>';
      } else {
        var src = base + encodeURIComponent(r.file);
        var meta = [desc, r.artist, r.license].filter(Boolean).join(" &middot; ");
        html += '<div class="res-card"><div class="res-body">' +
          '<p class="res-title"><a class="res-play" href="#">' + title + '</a></p>' +
          '<p class="res-meta">' + meta + ' &middot; <a href="' + src + '" download>' + S.dl + '</a></p>' +
          '</div><audio class="res-player" controls preload="none" src="' + src + '"></audio></div>';
      }
    });
    el.innerHTML = html;
    // exclusive playback, as on the Uruguay talk pages
    el.querySelectorAll(".res-play").forEach(function(a){   // the title plays the audio
      a.addEventListener("click", function(e){
        e.preventDefault();
        var card = a.closest(".res-card");
        var au = card && card.querySelector(".res-player");
        if (!au) return;
        if (au.paused) au.play(); else au.pause();
      });
    });
    var players = el.querySelectorAll(".res-player");
    players.forEach(function(p){
      p.addEventListener("play", function(){
        players.forEach(function(o){ if (o !== p) o.pause(); });
      });
    });
  }

  function decorate(){
    var c = document.getElementById("content");
    c.querySelectorAll("blockquote").forEach(function(b){
      var t = b.textContent;
      if (/^\s*(PRACTICE|PR[ÁA]CTICA|CHANT|CANTO)/.test(t)) b.className = "practice";
      else if (/^\s*(INSERT|INSERTO)/.test(t)) b.className = "insert";
      else if (/\[Swami/.test(t)) b.className = "quote";
    });
    c.innerHTML = c.innerHTML.replace(/⟨tr\.⟩/g,
      '<span class="tr" title="El traductor no tradujo este tramo en vivo; traducido del ingl\u00e9s.">tr</span>');
  }
  function show(lang){
    var md = cache[lang], c = document.getElementById("content"), f = document.getElementById("foot");
    var cut = md.lastIndexOf("\n---\n"), head = md.split("\n---\n");
    var body = head.length > 2 ? head.slice(1, -1).join("\n---\n") : md;
    c.innerHTML = marked.parse(body);
    f.innerHTML = marked.parse(md.slice(cut + 5));
    decorate();
    renderResources(RES, "resources/", lang);
    document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    document.getElementById("btn-es").setAttribute("aria-pressed", lang === "es" ? "true" : "false");
    document.documentElement.lang = lang;
    curLang = lang;
    applyMeta(lang);
  }
  function load(lang){
    if (cache[lang]) return show(lang);
    fetch("transcript-" + lang + ".md").then(function(r){ return r.text(); })
      .then(function(t){ cache[lang] = t; show(lang); })
      .catch(function(){ document.getElementById("content").innerHTML =
        "<p class='meta'>The transcript could not be loaded.</p>"; });
  }
  function choose(lang){           // only a real click is remembered; the default must stay free to change
    try { localStorage.setItem("sutras-lang-v2", lang); } catch(e){}
    load(lang);
  }
  document.getElementById("btn-en").addEventListener("click", function(){ choose("en"); });
  document.getElementById("btn-es").addEventListener("click", function(){ choose("es"); });
  document.getElementById("btn-theme").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : (cur === "light" ? "dark" :
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sutras-theme", next); } catch(e){}
  });
  try {
    var th = localStorage.getItem("sutras-theme");
    if (th) document.documentElement.setAttribute("data-theme", th);
  } catch(e){}
  // resolve the language ONCE, before either fetch: resources.json often wins the race,
  // and curLang was still null then, so a Spanish reader got English cards until the
  // transcript landed.
  curLang = pickLang(LANGS, DEFAULT_LANG);
  fetch("resources.json").then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ RES = d && d.resources; renderResources(RES, "resources/", curLang); }).catch(function(){});
  load(curLang);
})();
</script>
</body>
