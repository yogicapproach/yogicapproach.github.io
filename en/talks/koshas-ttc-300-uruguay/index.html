  <script src="assets/marked.min.js"></script>
  <script src="assets/shared.js"></script>
  <script>
    function loadSynthesis(lang) {
      ["en", "es", "ne"].forEach(function (l) { document.getElementById("btn-" + l).classList.toggle("active", lang === l); });
      document.documentElement.lang = lang;
      var u = new URL(location); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
      var el = document.getElementById("content");
      el.innerHTML = '<p id="loading">Loading&hellip;</p>';
      fetch("synthesis-" + lang + ".md").then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (md) { el.innerHTML = marked.parse(md); if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); } })
        .catch(function () { el.innerHTML = '<p style="color:#b3402a;text-align:center;padding:40px;">Could not load the synthesis.</p>'; });
    }
    document.addEventListener("DOMContentLoaded", function () {
      var l = new URLSearchParams(location.search).get("lang");
      loadSynthesis(l === "es" || l === "ne" ? l : "en");
    });
  </script>
