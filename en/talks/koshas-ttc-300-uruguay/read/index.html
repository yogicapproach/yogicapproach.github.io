<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Five Koshas — Transcripts | TTC-300, Uruguay</title>
  <script src="marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, 'Times New Roman', serif; line-height: 1.7; color: #333; max-width: 820px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 30px 0 16px; border-bottom: 1px solid #ddd; margin-bottom: 12px; }
    header h1 { font-size: 1.6em; margin-bottom: 5px; }
    header p { color: #666; font-size: 0.95em; }
    .sessions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 16px 0 6px; }
    .sessions button { padding: 7px 16px; font-size: 0.95em; cursor: pointer; border: 1px solid #bbb; border-radius: 999px; background: #fff; color: #555; transition: all .15s; }
    .sessions button.active { background: #7a5c1e; border-color: #7a5c1e; color: #fff; }
    .sessions button:hover:not(.active) { border-color: #7a5c1e; color: #7a5c1e; }
    .lang-toggle { display: flex; justify-content: center; gap: 10px; margin: 10px 0 4px; }
    .lang-toggle button { padding: 6px 20px; font-size: .95em; cursor: pointer; border: 2px solid #555; border-radius: 4px; background: #fff; color: #555; transition: all .2s; }
    .lang-toggle button.active { background: #555; color: #fff; }
    .lang-toggle button:hover:not(.active) { background: #444; color: #fff; }
    .sub { text-align: center; color: #888; font-size: .85em; margin-bottom: 8px; }
    #content { padding: 10px 0; }
    #content h1 { font-size: 1.5em; margin: 1.2em 0 .4em; }
    #content h2 { font-size: 1.25em; margin: 1.2em 0 .4em; }
    #content h3 { font-size: 1.08em; margin: 1em 0 .3em; color: #555; }
    #content p { margin: .8em 0; }
    #content blockquote { border-left: 3px solid #d9c9a3; padding-left: 1em; color: #666; margin: 1em 0; font-size: .95em; }
    #content strong { font-weight: bold; }
    #content hr { border: none; border-top: 1px solid #eee; margin: 1.6em 0; }
    #content a { color: #2a6496; }
    .notice { background: #faf6ec; border: 1px solid #e5d9b8; border-radius: 8px; padding: 14px 16px; color: #6b5a2e; margin: 16px 0; font-size: .95em; }
    /* discreet clickable timestamp -> YouTube deep-link (article stays the focus) */
    #content a.ts { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .72em; color: #b7ac93;
      text-decoration: none; vertical-align: .15em; margin-right: .15em; letter-spacing: .02em; }
    #content a.ts:hover { color: #7a5c1e; }
    #loading { text-align: center; padding: 40px; color: #999; }
    footer { text-align: center; padding: 26px 0 10px; border-top: 1px solid #ddd; margin-top: 36px; color: #999; font-size: .85em; }
    footer a { color: #7a5c1e; }
  </style>
</head>
<body>
  <header>
    <h1>The Five Koshas — Transcripts</h1>
    <p>Satchidananda &mdash; TTC-300, Uruguay &mdash; June 2026</p>
  </header>

  <div class="sessions" id="sessions"></div>
  <div class="lang-toggle">
    <button id="btn-en" onclick="setLang('en')">English</button>
    <button id="btn-es" onclick="setLang('es')">Espa&ntilde;ol</button>
  </div>
  <p class="sub" id="sub"></p>

  <div id="content"><p id="loading">Loading…</p></div>

  <footer>
    <a href="../transcript/">Line-by-line transcript portal</a> &nbsp;·&nbsp;
    <a href="../">Back to the Koshas series</a>
  </footer>

  <script>
    // 4-session series. EN = Satchidananda's canonical words (formatting only, not rewritten).
    // ES = the translator's ORIGINAL spoken Spanish — being re-extracted from the audio via the
    // Shruti bilingual pipeline (not a re-translation), so add es files as they land.
    var SESSIONS = [
      { id: "s1", n: 1, date: "June 10, 2026", en: true, es: true, yt: "" },
      { id: "s2", n: 2, date: "June 16, 2026", en: true, es: true, yt: "" },
      { id: "s3", n: 3, date: "June 18, 2026", en: true, es: true, yt: "" },
      { id: "s4", n: 4, date: "June 23, 2026", en: true, es: true, yt: "" }
    ];

    // Present as a clean article: drop the processing/meta header, and turn [mm:ss] (or [h:mm:ss])
    // paragraph markers into DISCREET clickable YouTube deep-links (watch at that moment).
    function toArticle(md, ytId) {
      var i = md.indexOf("\n---");                      // strip title + processing note (first --- block)
      if (i > -1) md = md.slice(i + 4);
      md = md.replace(/\*{0,2}\[(\d{1,2}):(\d{2})(?::(\d{2}))?\]\*{0,2}\s*/g, function (_, a, b, c) {
        var sec, label;
        if (c !== undefined) { sec = (+a) * 3600 + (+b) * 60 + (+c); label = a + ":" + b + ":" + c; }
        else { sec = (+a) * 60 + (+b); label = a + ":" + b; }
        var href = "#";
        return '<a class="ts" href="' + href + '" target="_blank" rel="noopener" ' +
               'title="Timestamp">' + label + "</a> ";
      });
      return md.trim();
    }
    var ES_PENDING = {
      en: "Spanish (the translator's original spoken words) is being extracted cleanly from the session audio via the Shruti bilingual pipeline — it will appear here as the translator's own words (not a re-translation of the English), so the two can be compared.",
      es: "El español (las palabras originales de la traductora en vivo) se está extrayendo del audio de la sesión con el sistema bilingüe de Shruti — aparecerá aquí en las palabras propias de la traductora (no una re-traducción del inglés), para poder compararlas."
    };
    var state = { session: "s1", lang: "en" };

    function renderTabs() {
      var host = document.getElementById("sessions");
      host.innerHTML = SESSIONS.map(function (s) {
        return '<button data-id="' + s.id + '"' + (s.id === state.session ? ' class="active"' : '') +
          ' onclick="setSession(\'' + s.id + '\')">Session ' + s.n + '</button>';
      }).join("");
      document.getElementById("btn-en").classList.toggle("active", state.lang === "en");
      document.getElementById("btn-es").classList.toggle("active", state.lang === "es");
      var s = SESSIONS.filter(function (x) { return x.id === state.session; })[0];
      document.getElementById("sub").textContent = "Session " + s.n + " · " + s.date;
    }

    function load() {
      renderTabs();
      var url = new URL(window.location);
      url.searchParams.set("s", state.session); url.searchParams.set("lang", state.lang);
      history.replaceState(null, "", url);
      var el = document.getElementById("content");
      var meta = SESSIONS.filter(function (x) { return x.id === state.session; })[0];
      if (state.lang === "es" && !meta.es) {
        el.innerHTML = '<div class="notice">' + ES_PENDING.es + "</div>";
        return;
      }
      el.innerHTML = '<p id="loading">Loading…</p>';
      fetch(state.session + "-" + state.lang + ".md")
        .then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (md) { el.innerHTML = marked.parse(toArticle(md, meta.yt)); })
        .catch(function () {
          el.innerHTML = '<div class="notice">' + ES_PENDING[state.lang === "es" ? "es" : "en"] + "</div>";
        });
    }
    function setSession(id) { state.session = id; load(); }
    function setLang(l) { state.lang = l; load(); }

    (function () {
      var q = new URLSearchParams(window.location.search);
      if (q.get("s")) state.session = q.get("s");
      if (q.get("lang")) state.lang = q.get("lang");
      load();
    })();
  </script>
</body>
</html>
